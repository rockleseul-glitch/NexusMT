<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Technicien — Nexus V3</title><meta name="theme-color" content="#0b5d66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mon Technicien"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="nexusmt-icon-192.png"><link rel="apple-touch-icon" href="nexusmt-apple-180.png">
<style>:root{--p:#0b5d66;--a:#f2a93b;--bg:#f4f7f8;--tx:#16282b;--mu:#5b6f73}*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:56px 0 76px}
header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--p);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:5;padding-top:env(safe-area-inset-top)}header img{border-radius:8px;background:#fff}header span{background:var(--a);color:#2a1d00;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px}
main{max-width:640px;margin:0 auto;padding:12px 14px}h2{font-size:17px;margin:20px 2px 8px}h2 small{font-weight:400;color:var(--mu)}h3{margin:6px 0}.sub{color:var(--mu);font-size:14px}
.card{background:var(--cd,#fff);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}.hero{background:linear-gradient(135deg,#0b5d66,#14808c);color:#fff}.hero select{background:#ffffff26;color:#fff;border-color:#fff6}.hero option{color:#000}.hero small{opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--cd,#fff);border-radius:14px;padding:12px;box-shadow:0 1px 3px #0002}.kpi b{display:block;font-size:24px;color:var(--p)}.kpi span{font-size:13px}.kpi i{display:block;font-size:12px;color:var(--mu);font-style:normal}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;color:#fff}.P1{--c:#c62828}.P2{--c:#ef6c00}.P3{--c:#b58900}.OK{--c:#2e7d32}.chip{background:var(--c)}.al{border-left:5px solid var(--c)}.why{background:var(--wh,#eef4f5);border-radius:10px;padding:2px 12px;margin-top:8px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd,#b9c7ca);border-radius:10px;background:var(--cd,#fff);color:var(--tx);margin:4px 0 12px;min-height:48px}label{font-size:14px;color:var(--mu);display:block}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:600;min-height:48px;cursor:pointer;margin:4px 6px 4px 0}.btn.alt{background:var(--cd,#fff);color:var(--p);border:2px solid var(--p)}.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--p);font:inherit;font-weight:600;padding:10px 0;min-height:44px;cursor:pointer}.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.seg button{flex:none;color:var(--tx);border:1px solid var(--bd,#b9c7ca);background:var(--cd,#fff);border-radius:99px;padding:10px 14px;font:inherit;min-height:44px}.seg .on{background:var(--p);color:#fff;border-color:var(--p)}
.neg{color:#c62828}.errtxt{color:#c62828;min-height:1.2em;margin:0 0 8px}.note{background:var(--nt,#fff7e0);border-radius:10px;padding:10px;margin-bottom:12px}.state{font-size:13px;color:var(--mu);margin:14px 4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.dot.on{background:#2e7d32}.dot.off{background:var(--a)}
.chat{display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:10px 12px;border-radius:14px}.m.u{align-self:flex-end;background:var(--p);color:#fff}.m.n{background:var(--cd,#fff);box-shadow:0 1px 3px #0002}.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.sugg button{color:var(--tx);border:1px solid var(--bd,#b9c7ca);background:var(--cd,#fff);border-radius:99px;padding:8px 12px;font:inherit;font-size:14px;min-height:40px}
.ask{display:flex;gap:6px}.ask input{margin:0}svg{width:100%;height:auto}.obj{stroke:#999;stroke-dasharray:4}.cur{fill:none;stroke:var(--p);stroke-width:2.5}circle{fill:var(--a)}.hist{list-style:none;margin:0;padding:0;font-size:14px}.hist li{padding:8px 0;border-bottom:1px solid var(--bd2,#e3eaec)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd,#fff);box-shadow:0 -1px 6px #0003;padding-bottom:env(safe-area-inset-bottom);z-index:5}nav button{flex:1;border:0;background:none;padding:14px 2px;font:inherit;font-size:13px;color:var(--mu);min-height:56px}nav .on{color:var(--p);font-weight:700;box-shadow:inset 0 3px var(--p)}
.bar{display:flex;flex-wrap:wrap;gap:0 16px;margin:0}
#maj{position:fixed;inset:0;background:#16282bb3;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.majc{background:var(--cd,#fff);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 4px 18px #0005}.majc p{margin:8px 0 14px}
#toast{position:fixed;left:14px;right:14px;bottom:84px;background:#16282b;color:#fff;padding:12px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#toast.show{opacity:1}#toast.err{background:#c62828}
@media print{.card{break-inside:avoid;box-shadow:none}.noprint,header,nav,#toast,.btn,.lnk,.seg,.bar,select{display:none!important}body{padding:0}}#boot{position:fixed;inset:0;z-index:30;background:#0b5d66;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .25s}#boot img{width:112px;height:112px}#boot b{font:600 20px system-ui,sans-serif}#boot.fin{opacity:0;pointer-events:none}#boot p{max-width:300px;margin:0;text-align:center;font:14px/1.4 system-ui,sans-serif;opacity:.92}
.throw{display:flex;gap:6px;margin:2px 0}.throw .btn{flex:1;margin:0;padding:10px 4px;font-size:14px;text-align:center}.app{display:flex;gap:12px;align-items:center}.app img{border-radius:12px;background:#fff;flex:none}
.al{--c:var(--p);--t:var(--cd,#fff)}.P1{--c:#c62828;--t:#fdecea}.P2{--c:#ef6c00;--t:#fff3e0}.P3{--c:#b58900;--t:#fff8e1}.OK{--c:#2e7d32;--t:#e8f5e9}
.al{border:2px solid var(--c);border-left-width:10px;background:var(--t);position:relative;box-shadow:0 3px 10px #0002}.al summary{font-size:17px}
.al.P1,.al.P2{margin-top:18px}.al.P1{box-shadow:0 0 0 3px #c6282833,0 4px 14px #c6282855}
.al.P1::after,.al.P2::after{position:absolute;top:-11px;right:12px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:99px;padding:3px 11px}
.al.P1::after{content:"⚠ URGENT";background:#c62828}.al.P2::after{content:"À SURVEILLER";background:#ef6c00}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 #c6282877,0 4px 14px #c6282855}50%{box-shadow:0 0 0 7px #c6282800,0 4px 14px #c6282855}}@media (prefers-reduced-motion:no-preference){.al.P1{animation:puls 2.2s ease-in-out infinite}}
.hero{background:linear-gradient(135deg,var(--h1,#0b5d66),var(--h2,#14808c))}
body.sup{--p:#1f7a3d;--a:#ef6c00;--bg:#fbf6ee;--h1:#d84315;--h2:#ef6c00}
body.sup header{background:linear-gradient(90deg,#d84315,#e65100)}body.sup header span{background:#1f7a3d;color:#fff}
body.sup header::after{content:"SUPERVISEUR";margin-left:auto;background:#fff;color:#d84315;font-weight:800;font-size:12px;letter-spacing:.5px;border-radius:99px;padding:3px 11px}
body.sup .card:not(.al),body.sup .kpi{border-top:4px solid #ffb74d}body.sup nav{border-top:3px solid #ef6c00}body.sup h2{color:#bf360c}

body.th-sombre{--bg:#12191b;--tx:#e6eef0;--mu:#9bb0b5;--p:#5fc4d2;--cd:#1d282b;--bd:#3d4e52;--bd2:#2c3a3e;--wh:#25353a;--nt:#3a3320;--h1:#0b3d44;--h2:#12606b;color-scheme:dark}
body.th-sombre .P1{--t:#3d1d1d}body.th-sombre .P2{--t:#3d2a14}body.th-sombre .P3{--t:#3a3314}body.th-sombre .OK{--t:#1b3320}
body.th-sombre .btn,body.th-sombre .m.u,body.th-sombre .seg .on{color:#06242a}body.th-sombre .btn.alt{color:var(--p)}
body.th-sombre:not(.sup) header{background:#0b3d44}body.th-sombre .neg,body.th-sombre .errtxt{color:#ff8a80}
body.th-bleu{--bg:#e8f0fb;--tx:#0d2240;--mu:#4a5f80;--p:#1565c0;--cd:#fff;--bd:#a9bbd6;--bd2:#d4e0f2;--wh:#dbe7f8;--nt:#fff7e0;--h1:#0d47a1;--h2:#1976d2}
body.th-bleu:not(.sup) header{background:#0d47a1}
body.th-sombre.sup{--p:#66bb6a;--bg:#161a14;--h1:#bf360c;--h2:#d84315}body.th-bleu.sup{--p:#1f7a3d;--h1:#d84315;--h2:#ef6c00}
body.th-sombre.sup h2{color:#ffab91}body.th-sombre.sup .card:not(.al),body.th-sombre.sup .kpi{border-top-color:#8d5a1f}
.th-btn{display:block;width:100%;text-align:left}
@media print{body,body.th-sombre,body.th-bleu,body.th-bleusombre,body.th-gris{--bg:#fff;--tx:#000;--cd:#fff;--mu:#444;--wh:#fff;--nt:#fff;--bd:#999}body.th-sombre .P1,body.th-sombre .P2,body.th-sombre .P3,body.th-sombre .OK,body.th-bleusombre .P1,body.th-bleusombre .P2,body.th-bleusombre .P3,body.th-bleusombre .OK{--t:#fff}}

#welcome{position:fixed;inset:0;z-index:25;background:#eaf6fb;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
#welcome .scene{position:relative;flex:none;height:46vh;min-height:300px;max-height:420px;overflow:hidden}
#welcome .scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#welcome .brand{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 18px) 16px 0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;text-shadow:0 2px 8px #0a3a4acc}
#welcome .brand img{width:96px;height:96px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 4px 16px #0a3a4a88}
#welcome .brand h1{margin:8px 0 0;font:800 28px/1.1 system-ui,sans-serif;letter-spacing:.3px}#welcome .brand h1 span{color:#9be564}
#welcome .brand p{margin:4px 0 0;font:600 14px/1.3 system-ui,sans-serif}
#welcome .sheet{flex:1;margin-top:-26px;position:relative;background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -6px 18px #0a3a4a33}
#welcome .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
#welcome .tiles button{border:0;border-radius:18px;color:#fff;font:700 16px/1.2 system-ui,sans-serif;min-height:96px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 10px #0003}
#welcome .tiles button i{font-style:normal;font-size:30px;line-height:1}
#welcome .tiles button:active{transform:scale(.97)}
#welcome .t1{background:linear-gradient(160deg,#2f7df6,#1555c8)}#welcome .t2{background:linear-gradient(160deg,#4fc34f,#2a9a2f)}
#welcome .t3{background:linear-gradient(160deg,#ff9a2e,#ec6a0a)}#welcome .t4{background:linear-gradient(160deg,#9a5cf0,#6b32c9)}
#welcome .t5{background:linear-gradient(160deg,#2aa6bb,#0f7488)}#welcome .t6{background:linear-gradient(160deg,#1b3b66,#0d2142)}
#welcome .t6 small{font-weight:500;font-size:11px;opacity:.85}
#welcome .go{display:block;width:100%;max-width:520px;margin:14px auto 0;background:#fff;color:#0b5d66;border:2px solid #0b5d66;border-radius:14px;min-height:48px;font:700 16px system-ui,sans-serif;cursor:pointer}
#welcome .foot{text-align:center;color:#5b6f73;font:italic 14px system-ui,sans-serif;margin:12px 0 0}
#welcome .scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:38% 60%;display:block}#welcome .shade{position:absolute;inset:0;background:linear-gradient(#0a3a4acc 0,#0a3a4a66 38%,#0a3a4a00 62%)}
#welcome .brand{z-index:2}
body.th-bleusombre{--bg:#04060c;--tx:#e4ecfa;--mu:#8fa3c4;--p:#4d94ff;--cd:#0b1222;--bd:#26345a;--bd2:#172140;--wh:#111b33;--nt:#2a2818;--h1:#0a1f55;--h2:#1456c8;color-scheme:dark}
body.th-bleusombre .P1{--t:#2e1620}body.th-bleusombre .P2{--t:#2d2113}body.th-bleusombre .P3{--t:#2b2713}body.th-bleusombre .OK{--t:#0f2a24}
body.th-bleusombre .btn,body.th-bleusombre .m.u,body.th-bleusombre .seg .on{color:#031226}body.th-bleusombre .btn.alt{color:var(--p)}
body.th-bleusombre:not(.sup) header{background:#0a1f55}body.th-bleusombre .neg,body.th-bleusombre .errtxt{color:#ff8a80}
body.th-bleusombre.sup{--p:#66bb6a;--h1:#bf360c;--h2:#d84315}body.th-bleusombre.sup h2{color:#ffab91}
body.th-gris{--bg:#e2e4e7;--tx:#1d2125;--mu:#5a626a;--p:#47525d;--cd:#f5f6f7;--bd:#a8aeb5;--bd2:#cfd3d7;--wh:#d6dadd;--nt:#f3f0e2;--h1:#3b444d;--h2:#5b6773}
body.th-gris:not(.sup) header{background:#3b444d}body.th-gris.sup{--p:#1f7a3d;--h1:#d84315;--h2:#ef6c00}
.throw{flex-wrap:wrap}.throw .btn{flex:1 1 30%}
#welcome.fin{opacity:0;pointer-events:none;transition:opacity .25s}
